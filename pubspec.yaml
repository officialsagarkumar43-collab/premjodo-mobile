name: prem_jodo_mobile
description: "Prem Jodo - Next-Gen Matchmaking & Social Dating Mobile Application for iOS & Android."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Networking & Real-time
  dio: ^5.4.3+1
  socket_io_client: ^3.0.1
  google_sign_in: ^6.2.2
  
  # Video & Audio Calling
  agora_rtc_engine: ^6.3.2
  permission_handler: ^11.3.1
  
  # Local Storage & Preferences
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^11.2.0
  
  # UI & Design System
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  font_awesome_flutter: ^10.7.0
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  carousel_slider: ^5.0.0
  flutter_card_swiper: ^7.0.0
  intl: ^0.19.0
  
  # Media & Hardware
  image_picker: ^1.1.2
  audioplayers: ^6.0.0
  url_launcher: ^6.2.6
  geolocator: ^14.0.2
  razorpay_flutter: ^1.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

dependency_overrides:
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
